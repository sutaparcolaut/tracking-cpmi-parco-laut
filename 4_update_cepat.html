<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Update Cepat - PT Parco Laut</title>
<link rel="manifest" href="manifest-update.json" />
<meta name="theme-color" content="#163a5c" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Update Cepat" />
<style>
  :root {
    --navy-900: #163a5c; --navy-800: #1f5c96; --blue-700: #3382c9; --blue-600: #52a3e0; --blue-500: #82c2ef;
    --blue-100: #eaf6fe; --blue-50: #f7fbfe; --gold: #c9a769; --gold-soft: #f2e6cc;
    --bg: #f1f7fc; --border: #dfebf6; --text: #1c334a; --muted: #6a8099;
    --ok-bg: #e2f5ea; --ok-text: #146a3d;
    --bad-bg: #fdeaea; --bad-text: #9a2b2b;
    --warn-bg: #fdf1de; --warn-text: #8a5a10;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overscroll-behavior: none;
  }
  input, button { font-family: inherit; color: var(--text); }

  /* Perbaikan bug umum di HP (terutama iPhone/Safari): teks di kolom login
     kadang jadi tak terlihat (transparan) saat browser mendeteksi autofill. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text) !important;
    -webkit-box-shadow: 0 0 0 1000px #fff inset !important;
    caret-color: var(--text);
  }

  /* ===== Login ===== */
  #loginScreen {
    flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px;
    background: linear-gradient(160deg, var(--navy-900), var(--navy-800) 60%, var(--blue-700));
  }
  .login-card {
    background: #fff; border-radius: 18px; padding: 30px 26px; width: 320px; max-width: 90vw;
    box-shadow: 0 30px 70px -20px rgba(6,20,36,.5); text-align: center; border-top: 4px solid var(--gold);
  }
  .login-card img { width: 52px; height: 52px; border-radius: 50%; margin-bottom: 10px; box-shadow: 0 0 0 3px var(--blue-100); }
  .login-card h2 { font-size: 15px; margin: 0 0 2px; color: var(--navy-900); text-transform: uppercase; }
  .login-card p { font-size: 11.5px; color: var(--muted); margin: 0 0 18px; }
  .login-card label { display: block; text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .login-card input { width: 100%; padding: 9px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; font-size: 13px; color: var(--text); background: #fff; }
  .login-card button { width: 100%; padding: 11px; border: none; border-radius: 8px; background: linear-gradient(135deg, var(--blue-600), var(--blue-700)); color: #fff; font-weight: 700; font-size: 13.5px; cursor: pointer; }
  #loginError { color: var(--bad-text); font-size: 11.5px; min-height: 14px; margin-bottom: 4px; }

  /* ===== Chat screen ===== */
  #chatScreen { display: none; flex-direction: column; height: 100vh; }
  .chat-header {
    background: linear-gradient(120deg, #eaf6fe, #d6ecfb); padding: 12px 16px;
    display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--gold);
    box-shadow: 0 2px 8px rgba(20,84,143,.08);
  }
  .chat-header img { width: 32px; height: 32px; border-radius: 50%; }
  .chat-header .title { font-weight: 700; font-size: 13.5px; color: var(--navy-900); }
  .chat-header .subtitle { font-size: 10.5px; color: var(--blue-700); }
  .chat-header .logout { margin-left: auto; background: none; border: none; font-size: 11px; color: var(--muted); cursor: pointer; text-decoration: underline; }

  .chat-feed { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 84%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, var(--blue-600), var(--blue-700)); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.bot { align-self: flex-start; background: #fff; border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 4px; }
  .bubble.bot.ok { border-color: #b9e3c8; background: var(--ok-bg); color: var(--ok-text); }
  .bubble.bot.err { border-color: #f4c3c3; background: var(--bad-bg); color: var(--bad-text); }
  .bubble.bot.warn { border-color: #f3d9a8; background: var(--warn-bg); color: var(--warn-text); }
  .bubble.hint { align-self: center; font-size: 11px; color: var(--muted); background: transparent; }

  .quick-chips { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; }
  .quick-chips button {
    border: 1px solid var(--border); background: #fff; color: var(--navy-800); font-size: 11.5px;
    padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .quick-chips button:active { background: var(--blue-100); }

  .input-row {
    display: flex; gap: 8px; padding: 10px 12px; background: #fff; border-top: 1px solid var(--border);
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .input-row input {
    flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid var(--border); font-size: 14px;
  }
  .input-row input:focus { outline: none; border-color: var(--blue-500); }
  .input-row button {
    width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, var(--blue-600), var(--blue-700)); color: #fff; font-size: 18px; cursor: pointer;
  }
</style>
</head>

  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginError').textContent = msg || '';
}

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errorBox = document.getElementById('loginError');
  if (!username || !password) { errorBox.textContent = 'Username dan password wajib diisi.'; return; }
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Memeriksa...'; btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username, password }) });
    const json = await res.json();
    if (json && json.success) {
      currentUser = { username, password };
      sessionStorage.setItem('cpmi_quick_user', JSON.stringify(currentUser));
      showChat();
    } else {
      errorBox.textContent = 'Username atau password salah.';
    }
  } catch (e) {
    errorBox.textContent = 'Gagal menghubungi server. Cek koneksi internet.';
  }
  btn.textContent = 'Masuk'; btn.disabled = false;
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null;
  sessionStorage.removeItem('cpmi_quick_user');
  showLogin('');
});

async function refreshRecords() {
  try {
    const url = API_URL + '?username=' + encodeURIComponent(currentUser.username) + '&password=' + encodeURIComponent(currentUser.password);
    const res = await fetch(url);
    const json = await res.json();
    if (Array.isArray(json)) records = json;
  } catch (e) { /* diam-diam gagal, coba lagi nanti saat kirim pesan */ }
}

function addUserBubble(text) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'bubble user';
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function addBotBubble(html, type) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'bubble bot' + (type && type !== 'hint' ? ' ' + type : '') + (type === 'hint' ? ' hint' : '');
  div.innerHTML = html;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function appendQuick(text) {
  const input = document.getElementById('chatInput');
  input.value = (input.value.trim() ? input.value.trim() + ' ' : '') + text;
  input.focus();
}

function fmtTanggalIndo(iso) {
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
}

// ===== Parsing pesan bebas jadi: nama + field/status yang mau diupdate =====
function parseQuickUpdate(text) {
  const original = text.trim();
  const lower = original.toLowerCase();

  const fieldPatterns = [
    { regex: /rekom\s*id|rekom/, field: 'rekom', label: 'Rekom ID' },
    { regex: /\bmcu\b/, field: 'mcu', label: 'MCU' },
    { regex: /\bec\b/, field: 'ec', label: 'Tanggal EC' },
    { regex: /grup\s*majikan|grup\s*cari\s*majikan|\bgrup\b/, field: 'grup', label: 'Grup Cari Majikan' },
    { regex: /\bizin\b/, field: 'izin', label: 'Penyerahan Surat Izin' },
    { regex: /\bdaftar\b/, field: 'daftar', label: 'Tanggal Daftar' },
    { regex: /\bpaspor\w*/, field: 'statuspaspor', label: 'Status Paspor', value: 'Perpanjang', extraField: 'tglpaspor' },
  ];
  const statusPatterns = [
    { regex: /\bselesai\b/, status: 'selesai', label: 'Selesai' },
    { regex: /\bbatal\b|\bmundur\b/, status: 'batal', label: 'Batal / Mundur' },
    { regex: /\bberjalan\b/, status: 'berjalan', label: 'Berjalan' },
  ];

  let field = null, fieldIdx = -1;
  fieldPatterns.forEach((p) => {
    const m = lower.match(p.regex);
    if (m && (fieldIdx === -1 || m.index < fieldIdx)) { field = p; fieldIdx = m.index; }
  });

  let status = null, statusIdx = -1;
  statusPatterns.forEach((p) => {
    const m = lower.match(p.regex);
    if (m && (statusIdx === -1 || m.index < statusIdx)) { status = p; statusIdx = m.index; }
  });

  let cutIdx = -1;
  if (field && (statusIdx === -1 || fieldIdx <= statusIdx)) cutIdx = fieldIdx;
  else if (status) cutIdx = statusIdx;

  let namaPart = cutIdx > -1 ? original.slice(0, cutIdx) : original;
  namaPart = namaPart
    .replace(/\b(sudah|sdh|udah|telah|masuk|sekarang|hari ini|tgl|tanggal|status|jadi|proses)\b/gi, ' ')
    .replace(/[.,:\-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  return { nama: namaPart, field, status };
}

async function handleSend() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addUserBubble(text);
  input.value = '';

  const parsed = parseQuickUpdate(text);

  if (!parsed.nama) {
    addBotBubble('⚠ Nama CPMI tidak terdeteksi. Coba ketik ulang, misalnya: <b>"Danenti sudah MCU"</b>.', 'err');
    return;
  }
  if (!parsed.field && !parsed.status) {
    addBotBubble('⚠ Kata kunci proses tidak dikenali. Gunakan salah satu: <b>MCU, Rekom ID, Paspor, EC, Daftar, Izin, Grup, Selesai, Batal, Berjalan</b>.', 'err');
    return;
  }

  await refreshRecords();
  const nq = parsed.nama.toLowerCase();
  const matches = records.filter(r => (r.nama || '').toLowerCase().includes(nq));

  if (matches.length === 0) {
    addBotBubble(`⚠ Tidak ditemukan CPMI dengan nama mengandung "<b>${parsed.nama}</b>". Cek ejaan nama, atau buka web lengkap untuk cari manual.`, 'err');
    return;
  }
  if (matches.length > 1) {
    const daftarNama = matches.slice(0, 6).map(r => r.nama).join(', ');
    addBotBubble(`⚠ Ada ${matches.length} CPMI dengan nama mirip "<b>${parsed.nama}</b>": ${daftarNama}. Tolong ketik nama lebih lengkap/spesifik.`, 'warn');
    return;
  }

  const record = matches[0];
  const today = new Date().toISOString().slice(0, 10);
  const updated = Object.assign({}, record);
  let pesanBerhasil = '';

  if (parsed.field) {
    if (Object.prototype.hasOwnProperty.call(parsed.field, 'value')) {
      updated[parsed.field.field] = parsed.field.value;
      if (parsed.field.extraField) updated[parsed.field.extraField] = today;
      pesanBerhasil = `${parsed.field.label} diubah jadi "${parsed.field.value}"` + (parsed.field.extraField ? ` (tanggal ${fmtTanggalIndo(today)})` : '');
    } else {
      updated[parsed.field.field] = today;
      pesanBerhasil = `${parsed.field.label} diisi tanggal ${fmtTanggalIndo(today)}`;
    }
  }
  if (parsed.status) {
    updated.status = parsed.status.status;
    if (parsed.status.status === 'selesai' && !updated.selesaiDate) updated.selesaiDate = today;
    if (parsed.status.status !== 'selesai') updated.selesaiDate = '';
    pesanBerhasil = (pesanBerhasil ? pesanBerhasil + ', dan ' : '') + `status diubah jadi "${parsed.status.label}"`;
  }

  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', record: updated, username: currentUser.username, password: currentUser.password })
    });
    addBotBubble(`✅ <b>${record.nama}</b> — ${pesanBerhasil}.`, 'ok');
    refreshRecords();
  } catch (e) {
    addBotBubble('⚠ Gagal menyimpan ke server. Coba lagi atau cek koneksi internet.', 'err');
  }
}

document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

(function init() {
  const saved = sessionStorage.getItem('cpmi_quick_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showChat();
  } else {
    showLogin('');
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
