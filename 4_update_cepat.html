<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Update Cepat - PT Parco Laut</title>
<link rel="manifest" href="manifest-update.json" />
<meta name="theme-color" content="#020610" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Update Cepat" />
<style>
  :root {
    --navy-900: #163a5c; --navy-800: #1f5c96; --blue-700: #3382c9; --blue-600: #52a3e0; --blue-500: #82c2ef;
    --blue-100: #eaf6fe; --blue-50: #f7fbfe; --gold: #c9a769; --gold-soft: #f2e6cc;
    --ai-bg: #eaf6fe; --ai-bg-2: #d2ecfa; --ai-panel: #ffffff; --ai-panel-2: #f3faff;
    --ai-cyan: #0ea5c4; --ai-cyan-soft: #3fcdec; --ai-violet: #6c8cff; --ai-violet-deep: #4d6fe0;
    --ai-steel-l: #eef4f9; --ai-steel: #aebfce; --ai-steel-d: #728299;
    --bg: var(--ai-bg); --border: #c3dcef; --text: #16324f; --muted: #5c7a94;
    --ok-bg: #e2f5ea; --ok-text: #146a3d;
    --bad-bg: #fdeaea; --bad-text: #b23a3a;
    --warn-bg: #fdf1de; --warn-text: #92650f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; color: var(--text);
    height: 100vh; height: 100dvh; display: flex; flex-direction: column; overscroll-behavior: none;
    background:
      radial-gradient(720px 420px at 15% -8%, rgba(108,140,255,.14), transparent 60%),
      radial-gradient(620px 480px at 105% 10%, rgba(14,165,196,.16), transparent 60%),
      repeating-linear-gradient(115deg, rgba(114,130,153,.05) 0px, rgba(114,130,153,.05) 1.5px, transparent 1.5px, transparent 8px),
      linear-gradient(180deg, var(--ai-bg), var(--ai-bg-2));
  }
  input, button { font-family: inherit; color: var(--text); }
  .steel-strip {
    height: 4px; flex-shrink: 0;
    background: repeating-linear-gradient(100deg, var(--ai-steel-d) 0px, var(--ai-steel-l) 3px, var(--ai-steel) 6px, var(--ai-steel-l) 9px);
    opacity: .8;
  }

  /* Perbaikan bug umum di HP (terutama iPhone/Safari): teks di kolom login
     kadang jadi tak terlihat (transparan) saat browser mendeteksi autofill. */
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text) !important;
    -webkit-box-shadow: 0 0 0 1000px #fff inset !important;
    caret-color: var(--text);
  }

  /* ===== Login (tema HUD gelap) ===== */
  #loginScreen {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 10px 16px 14px; position: relative; overflow-y: auto; overflow-x: hidden;
    background: radial-gradient(ellipse 900px 500px at 50% -6%, #0f2547, transparent 60%), linear-gradient(180deg, #081326, #020610 55%, #01040a);
  }
  .city-skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 210px; opacity: .9; pointer-events: none; z-index: 0; }
  .circuit-deco { position: absolute; top: 0; left: 0; right: 0; height: 190px; opacity: .5; pointer-events: none; z-index: 0; }

  .hud-panel {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 10px;
    background: rgba(10,25,50,.65); border: 1px solid rgba(56,189,248,.4);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
    font-size: 9px; color: #bfe6fb; letter-spacing: .04em; line-height: 1.35; font-weight: 700;
  }
  .hud-panel svg { flex-shrink: 0; }
  .hud-row { display: flex; justify-content: space-between; width: 100%; max-width: 360px; margin-bottom: 2px; position: relative; z-index: 2; }
  .hud-online { color: #34d399; display: flex; align-items: center; gap: 3px; }
  .hud-online .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; animation: dotBlink 1.6s ease-in-out infinite; }

  .login-particle {
    position: absolute; border-radius: 50%; pointer-events: none; z-index: 1;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.95), rgba(56,189,248,.3) 60%, transparent 75%);
    animation: particleFloat 8s ease-in-out infinite;
  }
  .login-particle.p1 { width: 8px; height: 8px; top: 16%; left: 8%; animation-delay: 0s; }
  .login-particle.p2 { width: 5px; height: 5px; top: 28%; right: 10%; animation-delay: 1.2s; animation-duration: 6.5s; }
  .login-particle.p3 { width: 10px; height: 10px; top: 50%; left: 5%; animation-delay: .6s; animation-duration: 9.5s; }
  .login-particle.p4 { width: 6px; height: 6px; top: 14%; right: 30%; animation-delay: 2s; animation-duration: 7s; }
  @keyframes particleFloat {
    0%, 100% { transform: translateY(0) translateX(0); opacity: .5; }
    50% { transform: translateY(-16px) translateX(7px); opacity: 1; }
  }

  .robot-hero { width: min(30vw, 118px); position: relative; z-index: 2; margin: 4px 0 -2px; animation: robotFloat 4s ease-in-out infinite; }
  .robot-hero img { width: 100%; display: block; position: relative; z-index: 2; filter: drop-shadow(0 10px 26px rgba(56,189,248,.45)); }
  .robot-rings { position: absolute; left: 50%; top: 44%; transform: translate(-50%,-50%); width: 230%; height: 230%; z-index: 1; pointer-events: none; }
  .robot-rings .ring-spin { animation: ringSpin 14s linear infinite; transform-origin: center; }
  .robot-rings .ring-spin-rev { animation: ringSpin 20s linear infinite reverse; transform-origin: center; }
  @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes robotFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-1deg); }
  }
  .gear-deco { animation: gearSpin 7s linear infinite; transform-origin: center; flex-shrink: 0; }
  .gear-deco.rev { animation-direction: reverse; animation-duration: 5.5s; }
  @keyframes gearSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .login-card {
    background: linear-gradient(180deg, rgba(9,20,40,.88), rgba(5,13,26,.92));
    border-radius: 20px; padding: 20px 22px 18px; width: 320px; max-width: 92vw;
    box-shadow: 0 0 0 1px rgba(56,189,248,.4), 0 0 40px -4px rgba(34,211,238,.3), 0 30px 50px -20px rgba(0,0,0,.6);
    text-align: center; position: relative; z-index: 3; overflow: hidden;
  }
  .login-card::before {
    content: ""; position: absolute; left: 0; right: 0; height: 2px; top: 0;
    background: linear-gradient(90deg, transparent, #7ee6f7, transparent);
    animation: scanLine 3.2s linear infinite; opacity: .9;
  }
  @keyframes scanLine { 0% { top: 0; } 100% { top: 100%; } }
  .login-card h2 { font-size: 21px; margin: 2px 0 1px; color: #fff; letter-spacing: .04em; text-transform: uppercase; text-shadow: 0 0 16px rgba(56,189,248,.6); }
  .ai-tagline {
    font-size: 9.5px; color: #38bdf8; letter-spacing: .12em; text-transform: uppercase; font-weight: 700;
    margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ai-tagline .dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; animation: dotBlink 1.6s ease-in-out infinite; }
  @keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .login-card p.subtitle-dark { font-size: 12px; color: #7fa8c9; margin: 0 0 14px; font-weight: 600; }
  .input-wrap { position: relative; margin-bottom: 8px; text-align: left; }
  .input-wrap svg.input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
  .login-card input {
    width: 100%; padding: 10px 14px 10px 38px; border: 1.4px solid rgba(56,189,248,.35); border-radius: 10px;
    font-size: 16px; color: #eaf6ff; background: rgba(255,255,255,.05);
  }
  .login-card input::placeholder { color: #587b98; }
  .login-card input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.18); }
  .eye-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;
    padding: 4px; cursor: pointer; color: #7fa8c9; display: flex;
  }
  .login-card button#loginBtn {
    width: 100%; padding: 13px; border: none; border-radius: 10px; margin-top: 4px;
    background: linear-gradient(135deg, #38bdf8, #4d6fe0); color: #fff; font-weight: 800; font-size: 14px;
    cursor: pointer; letter-spacing: .08em; text-transform: uppercase;
    box-shadow: 0 10px 24px -6px rgba(56,189,248,.55), 0 0 0 1px rgba(126,230,247,.3) inset;
  }
  .forgot-link { margin-top: 13px; font-size: 11.5px; color: #38bdf8; cursor: pointer; text-decoration: underline; }
  #loginError { color: #fb7185; font-size: 11.5px; min-height: 14px; margin-bottom: 2px; }

  .feature-badges {
    position: relative; z-index: 2; display: flex; justify-content: space-between; gap: 5px;
    width: 100%; max-width: 360px; margin-top: 8px;
  }
  .feature-badges > div {
    display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;
    padding: 8px 3px 7px; background: rgba(10,25,50,.6); border: 1px solid rgba(56,189,248,.35);
    clip-path: polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 7px 100%, 0 calc(100% - 7px));
  }
  .feature-badges span { font-size: 7.5px; color: #7fa8c9; letter-spacing: .02em; font-weight: 700; text-align: center; text-transform: uppercase; line-height: 1.2; }

  /* ===== Chat screen (tema senada dengan login: gelap + cyan) ===== */
  #chatScreen {
    display: none; flex-direction: column; height: 100vh; height: 100dvh;
    background: linear-gradient(180deg, #081326, #020610 55%, #01040a);
  }
  .chat-header {
    background: linear-gradient(120deg, rgba(9,20,40,.92), rgba(5,13,26,.92)); padding: 12px 16px;
    display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(56,189,248,.3);
    box-shadow: 0 2px 16px rgba(0,0,0,.4); position: relative;
  }
  .mini-orb {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; position: relative;
    animation: robotFloatMini 3.6s ease-in-out infinite;
  }
  .mini-orb img {
    width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block;
    border: 2px solid rgba(56,189,248,.55);
    box-shadow: 0 0 12px -1px rgba(56,189,248,.7);
  }
  @keyframes robotFloatMini { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
  .chat-header .title { font-weight: 700; font-size: 13.5px; color: #fff; letter-spacing: .02em; }
  .chat-header .subtitle { font-size: 10px; color: #38bdf8; display: flex; align-items: center; gap: 5px; letter-spacing: .03em; margin-top: 1px; font-weight: 700; }
  .chat-header .subtitle .dot { width: 5px; height: 5px; border-radius: 50%; background: #34d399; box-shadow: 0 0 6px #34d399; animation: dotBlink 1.6s ease-in-out infinite; }
  .chat-header .logout { margin-left: auto; background: none; border: none; font-size: 11px; color: #7fa8c9; cursor: pointer; text-decoration: underline; }

  .chat-feed { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 1; }
  .bubble { max-width: 84%; padding: 10px 13px; border-radius: 14px; font-size: 13.5px; line-height: 1.4; }
  .bubble.user { align-self: flex-end; background: linear-gradient(135deg, #38bdf8, #6c8cff); color: #fff; font-weight: 600; border-bottom-right-radius: 4px; box-shadow: 0 6px 18px -6px rgba(56,189,248,.5); }
  .bubble.bot { align-self: flex-start; background: rgba(15,28,52,.9); border: 1px solid rgba(56,189,248,.28); color: #eaf6ff; border-bottom-left-radius: 4px; }
  .bubble.bot.ok { border-color: rgba(52,211,153,.45); background: rgba(20,50,40,.85); color: #6ee7b7; }
  .undo-btn {
    margin-top: 6px; padding: 5px 10px; font-size: 11px; font-weight: 700; border-radius: 999px;
    border: 1px solid rgba(248,113,113,.5); background: rgba(248,113,113,.12); color: #fca5a5; cursor: pointer;
  }
  .undo-btn:disabled { opacity: .5; cursor: default; border-color: rgba(127,168,201,.35); background: transparent; color: #7fa8c9; }
  .bubble.bot.err { border-color: rgba(248,113,113,.45); background: rgba(50,20,20,.85); color: #fca5a5; }
  .bubble.bot.warn { border-color: rgba(251,191,36,.4); background: rgba(50,40,10,.85); color: #fcd34d; }
  .bubble.hint { align-self: center; font-size: 11px; color: #7fa8c9; background: transparent; }

  .quick-chips { display: flex; gap: 6px; padding: 0 12px 8px; flex-wrap: wrap; position: relative; z-index: 1; }
  .quick-chips button {
    border: 1px solid rgba(56,189,248,.35); background: rgba(15,28,52,.85); color: #38bdf8; font-size: 11.5px;
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  .quick-chips button:active { background: rgba(56,189,248,.18); border-color: #38bdf8; }

  .input-row {
    display: flex; gap: 8px; padding: 10px 12px; background: rgba(8,19,38,.95); border-top: 1px solid rgba(56,189,248,.3);
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }
  .input-row input {
    flex: 1; padding: 11px 14px; border-radius: 999px; border: 1px solid rgba(56,189,248,.35); font-size: 16px;
    background: rgba(255,255,255,.05); color: #eaf6ff;
  }
  .input-row input::placeholder { color: #587b98; }
  .input-row input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,.16); }
  .input-row button {
    width: 44px; height: 44px; border-radius: 50%; border: none; flex-shrink: 0;
    background: linear-gradient(135deg, #38bdf8, #6c8cff); color: #fff; font-size: 18px; cursor: pointer;
    box-shadow: 0 6px 18px -4px rgba(56,189,248,.55);
  }
  #micBtn {
    background: rgba(56,189,248,.12); border: 1.5px solid rgba(56,189,248,.4); box-shadow: none;
    color: #38bdf8; display: flex; align-items: center; justify-content: center; transition: background .15s, color .15s;
  }
  #micBtn:active { background: rgba(56,189,248,.22); }
  #micBtn.listening {
    background: linear-gradient(135deg, #f87171, #ef4444); border-color: transparent; color: #fff;
    animation: micPulse 1.1s ease-in-out infinite;
  }
  @keyframes micPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(248,113,113,.55); }
    50% { box-shadow: 0 0 0 9px rgba(248,113,113,0); }
  }
  .tanggal-row {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: rgba(6,15,30,.9);
    border-top: 1px solid rgba(56,189,248,.25); font-size: 12px; color: #7fa8c9;
  }
  .tanggal-row input {
    padding: 5px 8px; border-radius: 7px; border: 1px solid rgba(56,189,248,.3); font-size: 12px;
    background: rgba(255,255,255,.06); color: #eaf6ff;
  }
  .tanggal-row input::-webkit-calendar-picker-indicator { filter: invert(1); }
  .tanggal-row #tanggalHint { font-size: 11px; color: #fbbf24; font-weight: 600; }
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzInLFKFOffxFPcAaXDQfQN10WXphQ-BXUekiPlSbozH36zq_iKnKrDTcorMrT9oGPE/exec';
let currentUser = null;
let records = [];

// Sapaan suara robot AI ketika berhasil masuk ke aplikasi
// ===== Perintah suara: tekan mikrofon, ngomong, otomatis diproses seperti mengetik =====
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceRecognizer = null;
let sedangMerekam = false;

function setupVoiceCommand() {
  const micBtn = document.getElementById('micBtn');
  if (!SpeechRecognitionAPI) return; // HP/browser tidak mendukung -> tombol tetap disembunyikan

  micBtn.style.display = 'flex';
  voiceRecognizer = new SpeechRecognitionAPI();
  voiceRecognizer.lang = 'id-ID';
  voiceRecognizer.continuous = false;
  voiceRecognizer.interimResults = false;
  voiceRecognizer.maxAlternatives = 1;

  voiceRecognizer.onresult = (e) => {
    const teksUcapan = e.results[0][0].transcript;
    const input = document.getElementById('chatInput');
    input.value = teksUcapan;
    handleSend();
  };
  voiceRecognizer.onerror = () => {
    addBotBubble('⚠ Tidak bisa mendengar dengan jelas. Coba lagi atau ketik manual.', 'err');
  };
  voiceRecognizer.onend = () => {
    sedangMerekam = false;
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if (sedangMerekam) {
      voiceRecognizer.stop();
      return;
    }
    sedangMerekam = true;
    micBtn.classList.add('listening');
    try {
      voiceRecognizer.start();
    } catch (e) {
      sedangMerekam = false;
      micBtn.classList.remove('listening');
    }
  });
}

function sapaanSuara() {
  try {
    if (!('speechSynthesis' in window)) return;
    const teks = "Hello Suta, I'm Jarvis. I'm ready to assist you with your work.";
    const utter = new SpeechSynthesisUtterance(teks);
    utter.lang = 'en-US';
    utter.pitch = 0.9;   // sedikit rendah & tenang, kesan asisten AI ala Jarvis
    utter.rate = 1;
    utter.volume = 1;

    const pasangSuaraLaluBicara = () => {
      const daftarSuara = speechSynthesis.getVoices();
      const suaraEnglish = daftarSuara.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      // Nama-nama suara laki-laki yang umum dipakai di berbagai HP/OS (Android, iOS, Windows)
      const namaLakiLaki = /male|david|daniel|james|mark|alex|fred|tom|guy|ryan|eric|george|matthew|christopher/i;
      const suaraLaki = suaraEnglish.find(v => namaLakiLaki.test(v.name) && !/female/i.test(v.name));
      const suaraEn = suaraLaki
        || suaraEnglish.find(v => v.lang === 'en-US')
        || suaraEnglish[0];
      if (suaraEn) utter.voice = suaraEn;
      // Nada dibuat lebih rendah supaya kedengaran maskulin, terutama kalau HP cuma
      // punya 1 suara (biasanya perempuan) dan tidak ketemu suara laki-laki eksplisit.
      utter.pitch = suaraLaki ? 0.9 : 0.55;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    };

    if (speechSynthesis.getVoices().length > 0) {
      pasangSuaraLaluBicara();
    } else {
      // Di sejumlah HP, daftar suara baru siap sesaat setelah halaman dibuka
      speechSynthesis.onvoiceschanged = pasangSuaraLaluBicara;
    }
  } catch (e) { /* diamkan kalau HP tidak mendukung text-to-speech */ }
}

function showChat() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('chatScreen').style.display = 'flex';
  addBotBubble('Halo! Ketik update CPMI di sini, contoh: <b>"Danenti sudah MCU"</b>. Nanti tanggal hari ini otomatis terisi di sistem.' + (SpeechRecognitionAPI ? ' Bisa juga pakai suara, tinggal tekan tombol 🎤.' : ''), 'hint');
  sapaanSuara();
  refreshRecords();
}

function showLogin(msg) {
  document.getElementById('chatScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginError').textContent = msg || '';
}

// Tombol mata di kolom Password: tampilkan/sembunyikan teks password
window.togglePasswordVisibility = function() {
  const pw = document.getElementById('loginPass');
  const icon = document.getElementById('eyeIcon');
  const nowHidden = pw.type === 'password';
  pw.type = nowHidden ? 'text' : 'password';
  icon.innerHTML = nowHidden
    ? '<path d="M3 3l18 18M10.6 10.7a3 3 0 0 0 4.2 4.2M9.9 5.2A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a15.6 15.6 0 0 1-3.4 4.3M6.6 6.6A15.7 15.7 0 0 0 2 12s3.6 7 10 7a10.4 10.4 0 0 0 3.4-.6" stroke="#7fa8c9" stroke-width="1.5" stroke-linecap="round"/>'
    : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z" stroke="#7fa8c9" stroke-width="1.5"/><circle cx="12" cy="12" r="3" stroke="#7fa8c9" stroke-width="1.5"/>';
};

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const errorBox = document.getElementById('loginError');
  if (!username || !password) { errorBox.textContent = 'Username dan password wajib diisi.'; return; }
  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Memeriksa...'; btn.disabled = true;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username, password }) });
    const json = await res.json();
    if (json && json.success) {
      currentUser = { username, password };
      sessionStorage.setItem('cpmi_quick_user', JSON.stringify(currentUser));
      showChat();
    } else {
      errorBox.textContent = 'Username atau password salah.';
    }
  } catch (e) {
    errorBox.textContent = 'Gagal menghubungi server. Cek koneksi internet.';
  }
  btn.textContent = 'Masuk'; btn.disabled = false;
}

document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('logoutBtn').addEventListener('click', () => {
  currentUser = null;
  sessionStorage.removeItem('cpmi_quick_user');
  showLogin('');
});

async function refreshRecords() {
  try {
    const url = API_URL + '?username=' + encodeURIComponent(currentUser.username) + '&password=' + encodeURIComponent(currentUser.password);
    const res = await fetch(url);
    const json = await res.json();
    if (Array.isArray(json)) records = json;
  } catch (e) { /* diam-diam gagal, coba lagi nanti saat kirim pesan */ }
}

function addUserBubble(text) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'bubble user';
  div.textContent = text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
}

function addBotBubble(html, type) {
  const feed = document.getElementById('chatFeed');
  const div = document.createElement('div');
  div.className = 'bubble bot' + (type && type !== 'hint' ? ' ' + type : '') + (type === 'hint' ? ' hint' : '');
  div.innerHTML = html;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  return div;
}

function appendQuick(text) {
  const input = document.getElementById('chatInput');
  input.value = (input.value.trim() ? input.value.trim() + ' ' : '') + text;
  input.focus();
}

function fmtTanggalIndo(iso) {
  const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const d = new Date(iso + 'T00:00:00');
  return `${d.getDate()} ${bulan[d.getMonth()]} ${d.getFullYear()}`;
}

// ===== Parsing pesan bebas jadi: nama + field/status yang mau diupdate =====
function parseQuickUpdate(text) {
  const original = text.trim();
  const lower = original.toLowerCase();

  const fieldPatterns = [
    { regex: /rekom\s*id|rekom/, field: 'rekom', label: 'Rekom ID' },
    { regex: /\bmcu\b/, field: 'mcu', label: 'MCU' },
    { regex: /\bec\b/, field: 'ec', label: 'Tanggal EC' },
    { regex: /\bopp\b/, field: 'opp', label: 'Tanggal OPP' },
    { regex: /grup\s*majikan|grup\s*cari\s*majikan|\bgrup\b/, field: 'grup', label: 'Grup Cari Majikan' },
    { regex: /\bizin\b/, field: 'izin', label: 'Penyerahan Surat Izin' },
    { regex: /\bdaftar\b/, field: 'daftar', label: 'Tanggal Daftar' },
    { regex: /\bpaspor\w*/, field: 'statuspaspor', label: 'Status Paspor', value: 'Perpanjang', extraField: 'tglpaspor' },
  ];
  const statusPatterns = [
    { regex: /\bselesai\b/, status: 'selesai', label: 'Selesai' },
    { regex: /\bbatal\b|\bmundur\b/, status: 'batal', label: 'Batal / Mundur' },
    { regex: /\bberjalan\b/, status: 'berjalan', label: 'Berjalan' },
  ];

  let field = null, fieldIdx = -1;
  fieldPatterns.forEach((p) => {
    const m = lower.match(p.regex);
    if (m && (fieldIdx === -1 || m.index < fieldIdx)) { field = p; fieldIdx = m.index; }
  });

  let status = null, statusIdx = -1;
  statusPatterns.forEach((p) => {
    const m = lower.match(p.regex);
    if (m && (statusIdx === -1 || m.index < statusIdx)) { status = p; statusIdx = m.index; }
  });

  let cutIdx = -1;
  if (field && (statusIdx === -1 || fieldIdx <= statusIdx)) cutIdx = fieldIdx;
  else if (status) cutIdx = statusIdx;

  let namaPart = cutIdx > -1 ? original.slice(0, cutIdx) : original;
  namaPart = namaPart
    .replace(/\b(sudah|sdh|udah|telah|masuk|sekarang|hari ini|tgl|tanggal|status|jadi|proses)\b/gi, ' ')
    .replace(/[.,:\-]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();

  return { nama: namaPart, field, status };
}

async function handleSend() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  addUserBubble(text);
  input.value = '';

  const parsed = parseQuickUpdate(text);

  if (!parsed.nama) {
    addBotBubble('⚠ Nama CPMI tidak terdeteksi. Coba ketik ulang, misalnya: <b>"Danenti sudah MCU"</b>.', 'err');
    return;
  }
  if (!parsed.field && !parsed.status) {
    addBotBubble('⚠ Kata kunci proses tidak dikenali. Gunakan salah satu: <b>MCU, Rekom ID, Paspor, EC, OPP, Daftar, Izin, Grup, Selesai, Batal, Berjalan</b>.', 'err');
    return;
  }

  await refreshRecords();
  const nq = parsed.nama.toLowerCase();
  const matches = records.filter(r => (r.nama || '').toLowerCase().includes(nq));

  if (matches.length === 0) {
    addBotBubble(`⚠ Tidak ditemukan CPMI dengan nama mengandung "<b>${parsed.nama}</b>". Cek ejaan nama, atau buka web lengkap untuk cari manual.`, 'err');
    return;
  }

  // Kalau ada nama yang PERSIS SAMA di antara hasil yang cocok, langsung pakai itu --
  // ini yang menyelesaikan kasus "Dede" vs "Dede Winengsih": ketik "Dede" akan
  // langsung kena ke CPMI bernama persis "Dede", bukan dianggap ambigu.
  const exactMatch = matches.find(r => (r.nama || '').toLowerCase() === nq);
  if (exactMatch) {
    terapkanUpdate(exactMatch, parsed);
    return;
  }

  if (matches.length > 1) {
    // Nama masih ambigu (beberapa nama mengandung teks yang sama) -> kasih tombol pilih
    // langsung, tidak perlu ketik ulang dari awal.
    const idParsed = 'pending_' + Date.now();
    pendingUpdates[idParsed] = parsed;
    const tombolPilihan = matches.slice(0, 6).map(r =>
      `<button onclick="pilihCpmiAmbigu('${idParsed}','${r.id}')" style="margin:3px 4px 0 0; padding:5px 10px; font-size:11.5px;">${r.nama}</button>`
    ).join('');
    addBotBubble(`⚠ Ada ${matches.length} CPMI dengan nama mirip "<b>${parsed.nama}</b>". Tap salah satu untuk lanjut:<br/>${tombolPilihan}`, 'warn');
    return;
  }

  terapkanUpdate(matches[0], parsed);
}

// Menyimpan sementara aksi (kategori/status) yang masih menunggu dipilih CPMI-nya
// waktu nama yang diketik ambigu (cocok ke beberapa orang).
const pendingUpdates = {};

window.pilihCpmiAmbigu = function(idParsed, recordId) {
  const parsed = pendingUpdates[idParsed];
  const record = records.find(r => r.id === recordId);
  if (!parsed || !record) return;
  delete pendingUpdates[idParsed];
  terapkanUpdate(record, parsed);
};

// Menyimpan data SEBELUM diubah, supaya bisa dibatalkan kalau salah input.
// Hanya update paling terakhir yang bisa dibatalkan -- begitu ada update baru,
// tombol "Batalkan" di gelembung sebelumnya otomatis dinonaktifkan.
let lastUndo = null;

async function terapkanUpdate(record, parsed) {
  const today = document.getElementById('tanggalInput').value || new Date().toISOString().slice(0, 10);
  const before = Object.assign({}, record);
  const updated = Object.assign({}, record);
  let pesanBerhasil = '';

  if (parsed.field) {
    if (Object.prototype.hasOwnProperty.call(parsed.field, 'value')) {
      updated[parsed.field.field] = parsed.field.value;
      if (parsed.field.extraField) updated[parsed.field.extraField] = today;
      pesanBerhasil = `${parsed.field.label} diubah jadi "${parsed.field.value}"` + (parsed.field.extraField ? ` (tanggal ${fmtTanggalIndo(today)})` : '');
    } else {
      updated[parsed.field.field] = today;
      pesanBerhasil = `${parsed.field.label} diisi tanggal ${fmtTanggalIndo(today)}`;
    }
  }
  if (parsed.status) {
    updated.status = parsed.status.status;
    if (parsed.status.status === 'selesai' && !updated.selesaiDate) updated.selesaiDate = today;
    if (parsed.status.status !== 'selesai') updated.selesaiDate = '';
    pesanBerhasil = (pesanBerhasil ? pesanBerhasil + ', dan ' : '') + `status diubah jadi "${parsed.status.label}"`;
  }

  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', record: updated, username: currentUser.username, password: currentUser.password })
    });

    // Nonaktifkan tombol "Batalkan" di gelembung update sebelumnya (cuma yang terakhir yang boleh aktif)
    document.querySelectorAll('.undo-btn:not(:disabled)').forEach(b => {
      b.disabled = true;
      b.textContent = 'Kedaluwarsa';
    });

    const undoId = 'undo_' + Date.now();
    lastUndo = { id: undoId, before };
    const bubble = addBotBubble(
      `✅ <b>${record.nama}</b> — ${pesanBerhasil}.<br/><button class="undo-btn" id="${undoId}" onclick="batalkanUpdateTerakhir('${undoId}')">↩ Batalkan, salah input</button>`,
      'ok'
    );
    refreshRecords();
  } catch (e) {
    addBotBubble('⚠ Gagal menyimpan ke server. Coba lagi atau cek koneksi internet.', 'err');
  }
}

// Membatalkan update TERAKHIR: mengembalikan data CPMI ke kondisi sebelum diubah.
window.batalkanUpdateTerakhir = async function(undoId) {
  if (!lastUndo || lastUndo.id !== undoId) return;
  const btn = document.getElementById(undoId);
  if (btn) { btn.disabled = true; btn.textContent = 'Membatalkan...'; }

  try {
    await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'update', record: lastUndo.before, username: currentUser.username, password: currentUser.password })
    });
    addBotBubble(`↩ Perubahan pada <b>${lastUndo.before.nama}</b> sudah dibatalkan, data dikembalikan seperti semula.`, 'warn');
    if (btn) { btn.textContent = '✓ Dibatalkan'; }
    lastUndo = null;
    refreshRecords();
  } catch (e) {
    addBotBubble('⚠ Gagal membatalkan. Coba lagi atau cek koneksi internet.', 'err');
    if (btn) { btn.disabled = false; btn.textContent = '↩ Batalkan, salah input'; }
  }
};

document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });

(function init() {
  setupVoiceCommand();

  // Jaring pengaman supaya kolom Username/Password tidak ketutup keyboard HP:
  // begitu kolom disentuh, otomatis digulir ke tengah layar.
  ['loginUser', 'loginPass'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener('focus', () => {
      setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 250);
    });
  });

  const todayIso = new Date().toISOString().slice(0, 10);
  const tanggalEl = document.getElementById('tanggalInput');
  tanggalEl.value = todayIso;
  tanggalEl.addEventListener('change', () => {
    const hint = document.getElementById('tanggalHint');
    hint.textContent = tanggalEl.value !== todayIso ? '⚠ Bukan hari ini' : '';
  });

  const saved = sessionStorage.getItem('cpmi_quick_user');
  if (saved) {
    currentUser = JSON.parse(saved);
    showChat();
  } else {
    showLogin('');
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
